services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: helpdesk-app:local
    restart: unless-stopped
    working_dir: /var/www/html
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - helpdesk_vendor:/var/www/html/vendor
      - helpdesk_public_build:/var/www/html/public/build
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    networks:
      - helpdesk

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - helpdesk_public_build:/var/www/html/public/build:ro
    depends_on:
      - app
    networks:
      - helpdesk

  queue:
    image: helpdesk-app:local
    restart: unless-stopped
    working_dir: /var/www/html
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    command: php artisan queue:work redis --queue=notifications,default --sleep=3 --tries=5 --timeout=90 --max-time=3600
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - helpdesk_vendor:/var/www/html/vendor
    depends_on:
      scheduler:
    image: helpdesk-app:local
    restart: unless-stopped
    working_dir: /var/www/html
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    command: php artisan schedule:work
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - helpdesk_vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_started
      redis-queue:
        condition: service_healthy
    networks:
      - helpdesk

  db:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - helpdesk

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-helpdesk}
      POSTGRES_USER: ${DB_USERNAME:-helpdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - helpdesk_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-helpdesk} -d ${DB_DATABASE:-helpdesk}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - helpdesk

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      - helpdesk

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - helpdesk_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - helpdesk

  redis-queue:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - helpdesk_redis_queue:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - helpdesk

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: helpdesk-observability
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - helpdesk_elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - monitoring
      - helpdesk

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.2
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - monitoring

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.2
    profiles: ["monitoring"]
    user: root
    restart: unless-stopped
    command: ["--strict.perms=false", "-e"]
    volumes:
      - ./docker/monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - helpdesk_filebeat:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - helpdesk_prometheus:/prometheus
    depends_on:
      - blackbox-exporter
      - alertmanager
      - postgres-exporter
      - cadvisor
      - node-exporter
      - redis-queue-exporter
    networks:
      - helpdesk
      - monitoring

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-use}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - helpdesk_grafana:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.5.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./docker/monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - helpdesk_loki:/loki
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./docker/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - helpdesk_alertmanager:/alertmanager
    depends_on:
      - mailpit
    networks:
      - helpdesk
      - monitoring

  alloy:
    image: grafana/alloy:v1.8.3
    profiles: ["monitoring"]
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./docker/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    profiles: ["monitoring"]
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)(/|$)
    volumes:
      - /:/host:ro
    networks:
      - monitoring

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --extend.query-path=/etc/postgres-exporter/queries.yml
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USERNAME:-helpdesk}:${DB_PASSWORD:-secret}@db:5432/${DB_DATABASE:-helpdesk}?sslmode=disable
    volumes:
      - ./docker/monitoring/postgres/queries.yml:/etc/postgres-exporter/queries.yml:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - helpdesk
      - monitoring

  redis-queue-exporter:
    image: oliver006/redis_exporter:v1.67.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis-queue:6379
    depends_on:
      redis-queue:
        condition: service_healthy
    networks:
      - helpdesk
      - monitoring

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./docker/monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - helpdesk
      - monitoring

volumes:
  helpdesk_postgres:
  helpdesk_redis:
  helpdesk_redis_queue:
  helpdesk_elasticsearch:
  helpdesk_filebeat:
  helpdesk_vendor:
  helpdesk_public_build:
  helpdesk_prometheus:
  helpdesk_grafana:
  helpdesk_loki:
  helpdesk_alertmanager:

networks:
  helpdesk:
    driver: bridge
  monitoring:
    driver: bridge
