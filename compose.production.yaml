services:
  app:
    image: ${HELPDESK_IMAGE:?Set HELPDESK_IMAGE to an immutable GHCR image tag}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      QUEUE_CONNECTION: redis
      REDIS_QUEUE_CONNECTION: queue
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_RETRY_AFTER: 120
    volumes:
      - ${HELPDESK_STORAGE_PATH:-./storage/app}:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    networks: [helpdesk]

  queue:
    image: ${HELPDESK_IMAGE:?Set HELPDESK_IMAGE to an immutable GHCR image tag}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: php artisan horizon
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      QUEUE_CONNECTION: redis
      REDIS_QUEUE_CONNECTION: queue
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_RETRY_AFTER: 120
    volumes:
      - ${HELPDESK_STORAGE_PATH:-./storage/app}:/var/www/html/storage/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      app:
        condition: service_started
    networks: [helpdesk]

  nginx:
    image: ${HELPDESK_NGINX_IMAGE:?Set HELPDESK_NGINX_IMAGE to an immutable GHCR image tag}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ${HELPDESK_STORAGE_PATH:-./storage/app}:/var/www/html/storage/app:ro
    depends_on:
      - app
    networks: [helpdesk]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - helpdesk_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [helpdesk]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - helpdesk_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [helpdesk]

  redis-queue:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - helpdesk_redis_queue:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [helpdesk]

volumes:
  helpdesk_postgres:
  helpdesk_redis:
  helpdesk_redis_queue:

networks:
  helpdesk:
    driver: bridge
