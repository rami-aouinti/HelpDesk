global:
  smtp_smarthost: "mailpit:1025"
  smtp_from: "alertmanager@helpdesk.test"
  smtp_require_tls: false

route:
  receiver: helpdesk-mailpit
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: helpdesk-mailpit
    email_configs:
      - to: "admin@helpdesk.test"
        send_resolved: true
