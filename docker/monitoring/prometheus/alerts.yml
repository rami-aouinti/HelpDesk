groups:
  - name: helpdesk-availability
    rules:
      - alert: HelpDeskHttpDown
        expr: probe_success{service="helpdesk-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HelpDesk HTTP endpoint is unavailable"
          description: "The {{ $labels.check }} probe for {{ $labels.instance }} has failed for more than 2 minutes."

      - alert: HelpDeskHttpSlow
        expr: probe_duration_seconds{service="helpdesk-http"} > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HelpDesk HTTP endpoint is slow"
          description: "{{ $labels.instance }} has responded in more than 2 seconds for 5 minutes."

  - name: helpdesk-infrastructure
    rules:
      - alert: PostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL metrics exporter is unavailable"
          description: "Prometheus cannot scrape PostgreSQL exporter."

      - alert: ContainerHighCpu
        expr: (sum by (name) (rate(container_cpu_usage_seconds_total{name=~".+"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container CPU usage is high"
          description: "Container {{ $labels.name }} has used more than 85% CPU for 10 minutes."

      - alert: ContainerHighMemory
        expr: (container_memory_working_set_bytes{name=~".+"} / container_spec_memory_limit_bytes{name=~".+"} > 0.9)
          and container_spec_memory_limit_bytes{name=~".+"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container memory usage is high"
          description: "Container {{ $labels.name }} is using more than 90% of its memory limit."

  - name: helpdesk-queue
    rules:
      - alert: HelpDeskQueueBacklog
        expr: helpdesk_queue_pending_pending_jobs > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HelpDesk queue backlog is growing"
          description: "There are more than 100 pending jobs for 5 minutes."

      - alert: HelpDeskFailedJobs
        expr: helpdesk_queue_failed_failed_jobs > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "HelpDesk has failed queue jobs"
          description: "Laravel has one or more failed jobs. Inspect the queue logs and failed_jobs table."
