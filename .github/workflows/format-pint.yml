name: Apply Pint formatting

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/format-pint.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, gd, intl, mbstring, opcache, pcntl, pdo_pgsql, pdo_sqlite, simplexml, xml, xmlreader, xmlwriter, zip
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Apply Pint formatting
        run: vendor/bin/pint

      - name: Commit formatting changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app bootstrap config database public resources routes tests
            git commit -m "style: apply Laravel Pint formatting"
            git push
          fi
