services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: helpdesk-app:local
    restart: unless-stopped
    working_dir: /var/www/html
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - helpdesk_vendor:/var/www/html/vendor
      - helpdesk_public_build:/var/www/html/public/build
    depends_on:
      db:
        condition: service_healthy
    networks:
      - helpdesk

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - helpdesk_public_build:/var/www/html/public/build:ro
    depends_on:
      - app
    networks:
      - helpdesk

  queue:
    image: helpdesk-app:local
    restart: unless-stopped
    working_dir: /var/www/html
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    command: php artisan queue:work database --sleep=3 --tries=3 --timeout=90
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - helpdesk_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - helpdesk

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-helpdesk}
      POSTGRES_USER: ${DB_USERNAME:-helpdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - helpdesk_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-helpdesk} -d ${DB_DATABASE:-helpdesk}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - helpdesk

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      - helpdesk

volumes:
  helpdesk_postgres:
  helpdesk_vendor:
  helpdesk_public_build:

networks:
  helpdesk:
    driver: bridge
